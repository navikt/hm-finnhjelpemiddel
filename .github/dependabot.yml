version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.READER_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "10:15"
    groups:
      minor:
        update-types:
          - "minor"
        exclude-patterns:
          - ["next", "@next*", "eslint-config-next"]
      major:
        update-types:
          - "major"
        exclude-patterns:
          - ["next", "@next*", "eslint-config-next"]
        group-by: dependency-name
      next:
        patterns:
          - ["next", "@next*", "eslint-config-next"]
        update-types:
          - "minor"
          - "major"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    registries:
      - npm-github
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      minor:
        update-types:
          - "minor"
      major:
        update-types:
          - "major"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
